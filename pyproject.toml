[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "rmm-awesome"
authors = [
  {name = "Pau Figueras", email = "github@pswsm.cat"},
  {name = "Michael Ciociola", email = "michael@ciocio.la"}
]
description = "A mod manager for RimWorld. Forked from rmm-spoons"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Archiving :: Packaging"
]
dependencies = [
    "tabulate",
    "bs4",
    "requests>=2.32.4",
    "tomli>=2.2.1",
    "tomli-w>=1.0.0",
]

[project.scripts]
rmm = "rmm.cli:run"

[project.urls]
Homepage = "https://github.com/pswsm/rmm"
Repository = "https://github.com/pswsm/rmm"

[tool.hatch.build.targets.wheel]
packages = ["src/rmm"]

[tool.hatch.version]
path = "src/rmm/__about__.py"

[tool.uv.sources]
rmm-awesome = { workspace = true }

[dependency-groups]
dev = [
    "ipython>=8.12.3",
    "rmm-awesome",
]
